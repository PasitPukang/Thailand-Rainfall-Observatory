services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-weather.sql:/docker-entrypoint-initdb.d/init-weather.sql:ro
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 10s
      timeout: 5s
      retries: 10

  seed-postgres:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/weather
      PYTHONPATH: /opt/airflow/project
    volumes:
      - ./:/opt/airflow/project:ro
    command: bash -c 'python -m database.seed_postgres'

  airflow-init:
    build: .
    depends_on:
      seed-postgres:
        condition: service_completed_successfully
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/weather
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      RAW_DIR: /opt/airflow/project/data/raw
      PYTHONPATH: /opt/airflow/project
    volumes: &airflow_volumes
      - ./:/opt/airflow/project
      - ./dags:/opt/airflow/dags
      - airflow_logs:/opt/airflow/logs
    command: >
      bash -c 'airflow db migrate && airflow users create
      --username admin --password "$$AIRFLOW_ADMIN_PASSWORD" --firstname Local --lastname Admin
      --role Admin --email admin@localhost.invalid || true'

  airflow-webserver:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    ports:
      - "127.0.0.1:8088:8080"
    command: webserver

  airflow-scheduler:
    build: .
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow_env
    volumes: *airflow_volumes
    command: scheduler

  dashboard:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      seed-postgres:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg2://airflow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/weather
      PROJECT_ROOT: /project
    volumes:
      - ./:/project:ro
    ports:
      - "127.0.0.1:8090:8090"

volumes:
  pgdata:
  airflow_logs:
